
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Birthday Surprise for Vasim!</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at top, #3b244f, #171326 70%);
  font-family: system-ui, sans-serif;
  color: white;
  overflow-x: hidden;
}

.wrap {
  text-align: center;
  width: min(92vw, 520px);
  padding: 28px 18px;
}

.eyebrow {
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #ffd77a;
  font-size: .78rem;
  font-weight: 800;
}

.title {
  font-size: clamp(2rem, 8vw, 3.4rem);
  line-height: 1.05;
  margin: 12px 0;
}

.sub {
  color: #e8dff0;
  margin-bottom: 26px;
}

.scene {
  height: 290px;
  position: relative;
  display: grid;
  place-items: end center;
  margin: auto;
  cursor: pointer;
}

.box {
  position: relative;
  width: 210px;
  height: 145px;
  background: linear-gradient(135deg, #ff5475, #bd174a);
  border-radius: 8px 8px 14px 14px;
  box-shadow: 0 22px 45px #09061288;
  z-index: 2;
}

.box:before {
  content: "";
  position: absolute;
  inset: 0 86px;
  background: #ffd66e;
}

.lid {
  position: absolute;
  width: 238px;
  height: 38px;
  left: -14px;
  top: -27px;
  background: linear-gradient(135deg, #ff7890, #d72b5b);
  border-radius: 8px;
  transform-origin: 15% 100%;
  z-index: 4;
  transition: transform .8s cubic-bezier(.2,.8,.2,1);
}

.lid:after {
  content: "";
  position: absolute;
  left: 96px;
  top: 0;
  width: 46px;
  height: 38px;
  background: #ffd66e;
}

.bow {
  position: absolute;
  left: 90px;
  top: -26px;
  width: 34px;
  height: 32px;
  border: 9px solid #ffd66e;
  border-radius: 50% 50% 8px 50%;
  transform: rotate(25deg);
}

.bow:after {
  content: "";
  position: absolute;
  width: 34px;
  height: 32px;
  border: 9px solid #ffd66e;
  border-radius: 50% 50% 50% 8px;
  left: 12px;
  top: -8px;
  transform: rotate(55deg);
}

.bananas {
  position: absolute;
  bottom: 84px;
  z-index: 3;
  font-size: 76px;
  letter-spacing: -25px;
  opacity: 0;
  transform: translateY(95px) scale(.35) rotate(-12deg);
  transition: all 1s cubic-bezier(.17,.89,.32,1.35);
  filter: drop-shadow(0 8px 5px #0005);
}

.bananas span {
  display: inline-block;
}

.bananas span:nth-child(2) {
  transform: rotate(14deg) translateY(-15px);
}

.bananas span:nth-child(3) {
  transform: rotate(-18deg) translateY(5px);
}

.spot {
  position: absolute;
  font-size: 24px;
  opacity: 0;
  transition: opacity .5s 1s;
}

.spot.a { top: 42px; left: 35px; }
.spot.b { top: 4px; right: 24px; }
.spot.c { top: 80px; right: 6px; }

.message {
  opacity: 0;
  transform: translateY(12px);
  transition: all .6s .7s;
}

.message h2 {
  font-size: clamp(1.5rem, 6vw, 2.3rem);
  color: #ffd66e;
  margin: 8px 0;
}

.message p {
  font-size: 1.05rem;
  line-height: 1.5;
  color: #f3eaf7;
}

.btn {
  border: 0;
  border-radius: 999px;
  padding: 15px 27px;
  background: #ffd66e;
  color: #381b36;
  font-weight: 900;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 8px 24px #0004;
}

.btn:active {
  transform: scale(.97);
}

.opened .lid {
  transform: translate(-15px,-48px) rotate(-28deg);
}

.opened .bananas {
  opacity: 1;
  transform: translateY(-20px) scale(1) rotate(0);
}

.opened .spot {
  opacity: 1;
}

.opened .message {
  opacity: 1;
  transform: translateY(0);
}

.opened .btn {
  display: none;
}

.hint {
  font-size: .78rem;
  color: #bdb0ca;
  margin-top: 16px;
}
</style>
</head>

<body>

<main class="wrap" id="app">

  <div class="eyebrow">
    🎉 A Special Delivery 🎉
  </div>

  <h1 class="title">
    Happy Birthday,<br>Vasim!
  </h1>

  <p class="sub">
    Someone has a very special gift for you...
  </p>

  <div class="scene" id="scene">

    <div class="bananas">
      <span>🍌</span>
      <span>🍌</span>
      <span>🍌</span>
      <span>🍌</span>

      <i class="spot a">🟤</i>
      <i class="spot b">🟤</i>
      <i class="spot c">🟤</i>
    </div>

    <div class="box">
      <div class="lid">
        <div class="bow"></div>
      </div>
    </div>

  </div>

  <button class="btn" id="open">
    🎁 Open Your Gift
  </button>

  <section class="message">
    <h2>Surprise! 🍌😂</h2>

    <p>
      Hope your year is as ripe as these bananas!
      <br>
      Stay awesome, Vasim.
      Have a <b>peel</b>-ing good birthday! 🥳
    </p>
  </section>

  <div class="hint" id="hint">
    Tap the gift to reveal your birthday surprise
  </div>

</main>

<script>
const app = document.getElementById("app");
const hint = document.getElementById("hint");

function openGift() {
  app.classList.add("opened");
  hint.textContent =
    "Best birthday gift ever. You're welcome. 😂";
}

document.getElementById("open")
  .addEventListener("click", openGift);

document.getElementById("scene")
  .addEventListener("click", openGift);
</script>

</body>
</html>
